name: PR Factory

on:
  workflow_dispatch: {}
  # Comment the following cron schedule to stop running this workflow every 30 minutes
  schedule:
    - cron: 0/30 * * * *

permissions:
  pull-requests: write
  contents: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: trunk install
        uses: trunk-io/trunk-action/install@v1
        with:
          tools: gh

      - uses: robinraju/release-downloader@v1.13
        with:
          repository: trunk-io/mergequeue-tool
          latest: true
          preRelease: true
          fileName: mq-*-x86_64-unknown-linux-gnu.tar.gz
          extract: true

      - name: run mq
        id: edits
        run:
          ./mq generate --gh-token=${{ secrets.ELI_MERGEDEMO }} --gh-token=${{ secrets.SAM_MERGEDEMO
          }} --gh-token=${{ secrets.ROBERT_MERGEDEMO }} --gh-token=${{ secrets.PHIL_MERGEDEMO }}
        env:
          # used by tools/gh_enqueue.sh (merge.run) to add each PR to the GitHub merge queue
          GH_TOKEN: ${{ secrets.ELI_MERGEDEMO }}

      - name: run mq
        if: always()
        id: clean
        run:
          ./mq housekeeping --gh-token=${{ secrets.ELI_MERGEDEMO }} --gh-token=${{
          secrets.SAM_MERGEDEMO }}

      # GitHub merge queue removes failed PRs without a comment, so mq housekeeping (which matches
      # Trunk's "removed from the merge queue" comment) never sees them. Close PRs that are neither
      # in the queue nor waiting on auto-merge once they are older than pullrequest.close_stale_after.
      # isInMergeQueue is GraphQL-only (not in `gh pr list --json`), and a queued PR has no
      # autoMergeRequest, so both are needed.
      - name: close PRs dropped from the merge queue
        if: always()
        run: |
          cutoff=$(date -u -d "$(./mq config pullrequest.close_stale_after) ago" +%Y-%m-%dT%H:%M:%SZ)
          gh api graphql --paginate -F owner="${GITHUB_REPOSITORY_OWNER}" -F repo="${GITHUB_REPOSITORY#*/}" \
            -f query='query($owner: String!, $repo: String!, $endCursor: String) {
              repository(owner: $owner, name: $repo) {
                pullRequests(states: OPEN, first: 100, after: $endCursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes { number createdAt isInMergeQueue autoMergeRequest { enabledAt } }
                }
              }
            }' \
            --jq ".data.repository.pullRequests.nodes[] | select(.isInMergeQueue == false and .autoMergeRequest == null and .createdAt < \"${cutoff}\") | .number" |
            while read -r pr; do
              gh pr close "${pr}" --comment "Closed: dropped from the GitHub merge queue and stale"
            done
        env:
          GH_TOKEN: ${{ secrets.ELI_MERGEDEMO }}
