name: PR Testing
run-name: PR Checks for ${{ github.ref_name }}
on:
  pull_request: {}
  # GitHub merge queue tests each queued group on a gh-readonly-queue/main/* branch.
  merge_group: {}

concurrency:
  group: pr-test-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    # The job name is the required status check, so it must be the same on pull_request and
    # merge_group or the merge queue waits forever for a check that never reports.
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: robinraju/release-downloader@v1.13
        with:
          repository: trunk-io/mergequeue-tool
          latest: true
          preRelease: false
          fileName: mq-*-x86_64-unknown-linux-gnu.tar.gz
          extract: true

      - name: run tests
        # mq only sleeps and flakes when IS_MERGE is true, so the PR run passes right away and the
        # simulated test cost lands on the merge queue, as it does in the Trunk demo repos.
        run: ./mq test-sim
        env:
          IS_MERGE: ${{ github.event_name == 'merge_group' }}
