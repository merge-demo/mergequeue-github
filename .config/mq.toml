# GitHub merge queue comparison repo. Load and Bazel tuning mirror merge-demo/mergequeue-bazel so the
# two queues see the same traffic; only the queue differs.
# singlequeue: GitHub merge queue has no impacted-targets API, so nothing is uploaded to Trunk.
mode = "singlequeue"
build = "bazel"

[git]
name = "trunk bot"
email = "bot@trunk.io"

[test]
flake_rate = 0.01
# how long test should spin for (can be described as 10s, 7m, 1hr)
sleep_for = "8m"

[pullrequest]
labels = ""                     # label to apply to pull request on creation (comma separated list)
comment = ""
requests_per_hour = 60          # target number of pull requests per hour
run_generate_for = "50 minutes"
change_code_path = "bazel"

# how to distribute changes of impacted deps
# 55% - 1 dep change
# 35% - 2 dep change
# 9%  - 3 deps
# 1% - ALL will be specified
deps_distribution = "0.55x1,0.35x2,0.09x3,0.01xALL"

# how much of the PR budget is created as stacks (probabilityxdepth, must sum to 1.0)
# 60% - solo PRs
# 25% - 2-deep stacks
# 15% - 3-deep stacks
# only the top PR of a stack is enqueued; mq registers the stack with GitHub's stacks API first
stacks_distribution = "0.6x1,0.25x2,0.15x3"

# rate at which PRs should simulate a logical merge conflict and need to be rejected
logical_conflict_every = 100
logical_conflict_file = "logical-conflict.txt"

close_stale_after = "48 hours"

[merge]
# enqueue into the GitHub merge queue with `gh pr merge --auto` (see tools/gh_enqueue.sh)
trigger = "run"
run = "tools/gh_enqueue.sh {{PR_NUMBER}}"
